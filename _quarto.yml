project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"


website:
  open-graph: true
  title: "Ashley Fehr"
  site-url: https://amafehr.github.io
  repo-url: https://github.com/amafehr/amafehr.github.io
  favicon: images/octopus_icon_transparent.png

  navbar:
    style: "floating"
    background: dark
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
      # - href: CV.pdf
      #   text: CV
      # - href: Resume.pdf
      #   text: Resume
      # - href: publications.qmd
      #   text: Publications
    right:
      - href: https://github.com/amafehr/amafehr.github.io
        icon: github
        aria-label: "Source Code"
    search: true
    pinned: true

format:
  html:
    theme: _custom.scss
    toc: true
    smooth-scroll: true
    html-math-method: katex
    include-in-header:
      - includes.html
    footnotes-hover: false
    code-fold: true
    grid:
      body-width: 1100px